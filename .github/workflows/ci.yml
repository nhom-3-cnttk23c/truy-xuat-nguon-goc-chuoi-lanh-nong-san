name: CI Pipeline

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: 🐍 Backend (Lint & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ttcs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ttcs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ttcs_test
      DB_USER: ttcs_app
      DB_PASSWORD: app-test-password
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: postgres-test-password
      APP_ENV: test
      DEBUG: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements-dev.txt

      - name: Run linter (Ruff)
        run: |
          cd backend
          ruff check app/ tests/ alembic/

      - name: Check formatting (Ruff)
        run: |
          cd backend
          ruff format --check app/ tests/ alembic/

      - name: Run database migrations and schema check
        run: |
          cd backend
          python -m app.bootstrap_db_role
          # Đảm bảo chỉ có duy nhất 1 head revision (không bị branching vô tình)
          HEADS_COUNT=$(alembic heads | grep -c "^[a-f0-9_]") || true
          if [ "$HEADS_COUNT" -gt 1 ]; then
            echo "::error::Phat hien nhieu migration heads ($HEADS_COUNT heads). Vui long chay 'alembic merge' de gop revision!"
            exit 1
          fi
          # Simulate a clean legacy staging database at revision 08, before
          # Sprint 2 had added any harvest-lot fields.
          alembic upgrade 20261007_07
          alembic stamp 20261007_08
          alembic upgrade head
          alembic check
          # Rolling back to 07 keeps the additive schema, simulating the
          # historical revision 08 that already added harvest-lot fields.
          alembic downgrade 20261007_07
          alembic stamp 20261007_08
          alembic upgrade head
          alembic check

      - name: Verify Staging Seed Data Idempotency
        env:
          APP_ENV: staging
          MIGRATION_DATABASE_URL_ENV: postgresql+psycopg://postgres:postgres-test-password@localhost:5432/ttcs_test
        run: |
          cd backend
          # Chay seed lan 1 tren DB sau migrate
          python -c "from app.seed_demo import seed_demo_data; seed_demo_data()"
          # Chay seed lan 2 de dam bao tinh idempotent (restart service khong crash)
          python -c "from app.seed_demo import seed_demo_data; seed_demo_data()"

      - name: Run backend integration tests (Pytest)
        run: |
          cd backend
          pytest tests/ -v -m "not performance" --cov=app --cov-report=xml --cov-report=json
          pytest tests/ -v -m performance

      - name: Audit backend dependencies
        run: cd backend && pip-audit

      - name: Save coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json

  frontend-check:
    name: ⚛️ Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Audit frontend dependencies
        run: cd frontend && npm audit

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

      - name: Test frontend task pages and quantity validation
        run: |
          cd frontend
          npm test

  docker-check:
    name: 🐳 Docker Images Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t ttcs-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t ttcs-frontend:${{ github.sha }} ./frontend
