services:
  - type: web
    name: ttcs-backend-staging
    runtime: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m app.startup
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "False"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: DB_USER
        value: ttcs_app
      - key: DB_PASSWORD
        generateValue: true
      - key: DB_ADMIN_USER
        fromDatabase:
          name: ttcs-postgres-staging
          property: user
      - key: DB_ADMIN_PASSWORD
        fromDatabase:
          name: ttcs-postgres-staging
          property: password
      - key: DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString
      - key: MIGRATION_DATABASE_URL_ENV
        fromDatabase:
          name: ttcs-postgres-staging
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://ttcs-frontend-staging.onrender.com,http://localhost:5173,http://localhost:3000

  - type: web
    name: ttcs-frontend-staging
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ttcs-backend-staging.onrender.com

databases:
  - name: ttcs-postgres-staging
    region: singapore
    plan: free
    databaseName: ttcs_staging
    user: admin
